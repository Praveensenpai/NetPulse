name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Package Distributable & Compute Checksums
        shell: bash
        run: |
          mkdir -p dist
          # Find the generated APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            # Fallback if unminified release APK is named differently
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          DEST_APK="dist/NetPulse-${TAG_NAME}.apk"
          cp "$APK_FILE" "$DEST_APK"
          cd dist
          sha256sum "NetPulse-${TAG_NAME}.apk" > "NetPulse-${TAG_NAME}.apk.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
