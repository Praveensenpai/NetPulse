name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode stable release keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/netpulse-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/netpulse-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -5

      - name: Package Distributable & Compute Checksums
        shell: bash
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          DEST_APK="dist/NetPulse-${TAG_NAME}.apk"
          cp "$APK_FILE" "$DEST_APK"
          cd dist
          sha256sum "NetPulse-${TAG_NAME}.apk" > "NetPulse-${TAG_NAME}.apk.sha256"

      - name: Compose Release Notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          NOTES="release-notes/${TAG_NAME}.md"
          if [ -s "$NOTES" ]; then
            cp "$NOTES" release_notes.md
          else
            PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n1)
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..${TAG_NAME}"
            else
              RANGE="${TAG_NAME}"
            fi
            {
              echo "## ${TAG_NAME}"
              echo
              git log --pretty='- %s' "$RANGE"
            } > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG_NAME}." > release_notes.md
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
