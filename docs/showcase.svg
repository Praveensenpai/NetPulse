<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d28"/>
      <stop offset="100%" stop-color="#1f2533"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D68FF"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#56D364"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
  </g>

  <!-- Left: Samsung Galaxy Mockup Frame -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Device Body -->
    <rect width="300" height="520" rx="36" fill="#0d1117" stroke="#2d333b" stroke-width="3"/>

    <!-- Screen Area -->
    <rect x="8" y="8" width="284" height="504" rx="30" fill="#0f1117"/>

    <!-- Punch-hole Camera -->
    <circle cx="150" cy="24" r="5" fill="#05070a"/>

    <!-- Samsung Status Bar -->
    <text x="32" y="27" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">09:41</text>
    <!-- Dynamic Status Bar Speed Notification Icon -->
    <rect x="75" y="18" width="46" height="14" rx="7" fill="#2D68FF" fill-opacity="0.25"/>
    <text x="98" y="28" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">14.8M</text>
    <!-- Status bar icons (Wifi, Battery) -->
    <path d="M 240 22 Q 248 16 256 22" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="262" y="20" width="14" height="8" rx="2" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="264" y="22" width="9" height="4" rx="1" fill="#8b949e"/>

    <!-- App Bar -->
    <text x="24" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">NetPulse</text>

    <!-- Status Pill -->
    <rect x="24" y="82" width="136" height="26" rx="13" fill="#2EA043" fill-opacity="0.15"/>
    <circle cx="36" cy="95" r="4" fill="#2EA043"/>
    <text x="46" y="99" fill="#56D364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Monitoring Active</text>

    <!-- Speed Gauge Card -->
    <rect x="20" y="122" width="260" height="110" rx="18" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <!-- Download Metric -->
    <g transform="translate(40, 140)">
      <text x="24" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Download</text>
      <text x="24" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold">14.8</text>
      <text x="24" y="62" fill="#56D364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MB/s</text>
      <circle cx="8" cy="10" r="7" fill="#2EA043" fill-opacity="0.2"/>
      <path d="M 8 7 L 8 13 M 5 10 L 8 13 L 11 10" stroke="#56D364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Divider -->
    <line x1="150" y1="138" x2="150" y2="216" stroke="#30363d" stroke-width="1"/>
    <!-- Upload Metric -->
    <g transform="translate(170, 140)">
      <text x="24" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Upload</text>
      <text x="24" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold">2.1</text>
      <text x="24" y="62" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">MB/s</text>
      <circle cx="8" cy="10" r="7" fill="#2D68FF" fill-opacity="0.2"/>
      <path d="M 8 13 L 8 7 M 5 10 L 8 7 L 11 10" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Usage Card -->
    <rect x="20" y="244" width="260" height="92" rx="16" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1"/>
    <text x="36" y="266" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Today's Consumption</text>
    <g transform="translate(36, 280)">
      <text x="0" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Mobile Data</text>
      <text x="0" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">450.0 MB</text>
    </g>
    <g transform="translate(160, 280)">
      <text x="0" y="14" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Wi-Fi Network</text>
      <text x="0" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold">2.45 GB</text>
    </g>

    <!-- Toggle Preference Rows Mock -->
    <rect x="20" y="348" width="260" height="48" rx="12" fill="#161b22"/>
    <text x="36" y="377" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Status Bar Dynamic Icon</text>
    <!-- Switch ON -->
    <rect x="228" y="362" width="36" height="20" rx="10" fill="#2D68FF"/>
    <circle cx="254" cy="372" r="8" fill="#ffffff"/>

    <rect x="20" y="404" width="260" height="48" rx="12" fill="#161b22"/>
    <text x="36" y="433" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Pause When Screen Off</text>
    <!-- Switch ON -->
    <rect x="228" y="418" width="36" height="20" rx="10" fill="#2D68FF"/>
    <circle cx="254" cy="428" r="8" fill="#ffffff"/>

    <!-- Bottom Navigation Bar -->
    <rect x="8" y="466" width="284" height="46" rx="20" fill="#161b22"/>
    <g transform="translate(48, 480)">
      <circle cx="12" cy="12" r="3" fill="#58a6ff"/>
      <text x="12" y="24" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Speed</text>
    </g>
    <g transform="translate(142, 480)">
      <circle cx="12" cy="12" r="3" fill="#8b949e"/>
      <text x="12" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Settings</text>
    </g>
    <g transform="translate(236, 480)">
      <circle cx="12" cy="12" r="3" fill="#8b949e"/>
      <text x="12" y="24" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Battery</text>
    </g>
  </g>

  <!-- Right: Architecture Highlights & Features -->
  <g transform="translate(420, 60)">
    <!-- Header Title -->
    <text x="0" y="30" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">SAMSUNG ONE UI OPTIMIZED</text>
    <text x="0" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Ultra-Low Power Telemetry</text>
    <text x="0" y="98" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Built specifically for Samsung Galaxy devices to deliver precision speed monitoring with zero battery drain.</text>

    <!-- Feature 1 -->
    <g transform="translate(0, 130)">
      <rect width="420" height="74" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="36" cy="37" r="18" fill="#2EA043" fill-opacity="0.15"/>
      <path d="M 30 37 L 35 42 L 43 32" fill="none" stroke="#56D364" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Zero-Wake Display-Off Suspension</text>
      <text x="70" y="52" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Halts polling immediately on screen lock. Zero CPU wakes.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 220)">
      <rect width="420" height="74" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="36" cy="37" r="18" fill="#2D68FF" fill-opacity="0.15"/>
      <path d="M 28 37 C 28 32 44 32 44 37 C 44 42 28 42 28 37 Z" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Kernel TrafficStats Counters</text>
      <text x="70" y="52" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Direct /proc/net/dev reads with microsecond execution overhead.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 310)">
      <rect width="420" height="74" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="36" cy="37" r="18" fill="#D29922" fill-opacity="0.15"/>
      <path d="M 36 28 L 36 38 M 36 44 L 36 46" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-linecap="round"/>
      <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Samsung Quick Panel &amp; Tile Integration</text>
      <text x="70" y="52" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">One-tap toggle directly from Samsung Quick Settings panel.</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(0, 400)">
      <rect width="420" height="74" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="36" cy="37" r="18" fill="#A371F7" fill-opacity="0.15"/>
      <path d="M 30 33 L 42 33 L 42 41 L 30 41 Z" fill="none" stroke="#bc8cff" stroke-width="2"/>
      <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">Mobile vs Wi-Fi Consumption Ledger</text>
      <text x="70" y="52" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Automated daily tracking with zero battery wake-up jobs.</text>
    </g>
  </g>
</svg>
